[project]
name = "autoresearch-control-center"
version = "0.1.0"
description = "Python research control center for AutoResearch"
requires-python = ">=3.12"
dependencies = [
  "nicegui==4.1.0",
  "plotly==7.2.0",
  "httpx==0.28.1",
]

[dependency-groups]
dev = [
  "pytest==9.2.0",
  "ruff==0.17.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
