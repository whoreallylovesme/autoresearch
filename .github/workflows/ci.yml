name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        if: hashFiles('go.mod') != ''
        with:
          go-version: "1.24"
      - name: Check formatting
        if: hashFiles('go.mod') != ''
        run: make fmt-check
      - name: Vet
        if: hashFiles('go.mod') != ''
        run: make lint
      - name: Test with race detector
        if: hashFiles('go.mod') != ''
        run: make test
      - name: Integration tests
        if: hashFiles('go.mod') != ''
        run: make test-integration
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: web/uv.lock
      - name: Lint
        run: make web-lint
      - name: Test
        run: make web-test
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject whitespace errors
        run: git diff-tree --check --root --no-commit-id -r HEAD
      - name: Reject accidentally committed credentials
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)(\.env|.*\.env|id_[^/]+|.*\.pem|.*\.key|.*\.tokens?|.*\.secrets?|operator-token|operator\.token)$'; then
            echo 'Potential credential file is tracked' >&2
            exit 1
          fi

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: web/uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Browser acceptance
        run: make browser-test

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker Compose acceptance
        run: make compose-test

  native-kimi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Native Kimi transport and session isolation
        run: make native-kimi-test

  deployment-auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deployment authentication shell tests
        run: make auth-test
