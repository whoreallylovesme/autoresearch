version: 1
name: native-kimi-web-demo

chief:
  config: agents/chief-scientist.yaml
workers:
  - config: agents/kimi-web-baby-scientist.yaml
    headcount: 2
  - config: agents/kimi-web-developer.yaml
    headcount: 1
  - config: agents/kimi-web-critic.yaml
    headcount: 1
  - config: agents/kimi-web-brainstormer.yaml
    headcount: 1

task: tasks/demo.yaml
budget: kimi-web-budget.yaml
executors: executors.yaml

runtime:
  autonomous: true
  max_parallel_tasks: 4
  checkpoint_interval: 10s
  resume_on_restart: true
  data_dir: ./data/native-kimi
  listen: 127.0.0.1:8080
