version: 1
provider: kimi-web
model: kimi-code/kimi-for-coding
base_url: http://127.0.0.1:58627
base_url_env: KIMI_WEB_BASE_URL
token_file: /run/kimi-web/server.token
session_workspace: /srv/autoresearch-private/kimi-sessions
parameters:
  permission_mode: manual
capabilities:
  streaming: false
  tools: true
  structured_outputs: false
  supported_parameters: [reasoning_effort, permission_mode, disabled_tools]
retry:
  max_attempts: 3
  backoff: exponential
  initial_interval: 500ms
  max_interval: 30s
timeout: 15m
rate_limit:
  requests_per_minute: 30
