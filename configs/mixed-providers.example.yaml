version: 1
name: openai-chief-kimi-fleet

chief:
  config: agents/openai-chief.example.yaml
workers:
  - config: agents/kimi-baby-scientist.example.yaml
    headcount: 2
  - config: agents/kimi-developer.example.yaml
    headcount: 1
  - config: agents/kimi-critic.example.yaml
    headcount: 1
  - config: agents/kimi-brainstormer.example.yaml
    headcount: 1

task: tasks/demo.yaml
budget: budget.yaml
executors: executors.yaml

runtime:
  autonomous: true
  max_parallel_tasks: 4
  checkpoint_interval: 10s
  resume_on_restart: true
  data_dir: ./data/mixed-providers
  listen: 127.0.0.1:8080
